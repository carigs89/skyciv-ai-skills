<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <style>
    .obj   { stroke:#2b6cb0; stroke-width:3; fill:none; }
    .ext   { stroke:#a0aec0; stroke-width:1.5; stroke-dasharray:5,4; }
    .dim   { stroke:#1a202c; stroke-width:1.5; fill:none; }
    .pt    { fill:#dd6b20; }
    .lbl   { fill:#1a202c; font-size:13px; }
    .lbl2  { fill:#718096; font-size:12px; }
    .val   { fill:#1a202c; font-size:14px; font-weight:bold; }
  </style>
  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>

  <!-- measured object line: p1 -> p2 -->
  <line class="obj" x1="90" y1="170" x2="330" y2="170"/>
  <circle class="pt" cx="90" cy="170" r="4"/>
  <circle class="pt" cx="330" cy="170" r="4"/>
  <text class="lbl" x="70" y="200">p1 (0, 0)</text>
  <text class="lbl" x="300" y="200">p2 (1000, 0)</text>

  <!-- extension lines from p1/p2 up to the dimension line -->
  <line class="ext" x1="90" y1="170" x2="90" y2="80"/>
  <line class="ext" x1="330" y1="170" x2="330" y2="80"/>

  <!-- dimension line with arrows -->
  <line class="dim" x1="90" y1="80" x2="330" y2="80"/>
  <path d="M90,80 L104,75 L104,85 Z" fill="#1a202c"/>
  <path d="M330,80 L316,75 L316,85 Z" fill="#1a202c"/>

  <!-- offsetPoint marker + value text -->
  <circle class="pt" cx="210" cy="80" r="4"/>
  <text class="val" x="178" y="62">1000 mm</text>
  <text class="lbl2" x="150" y="45">offsetPoint (500, 200)</text>
  <line class="lbl2" x1="210" y1="80" x2="210" y2="50" stroke="#718096" stroke-width="1"/>

  <text class="lbl2" x="335" y="120">extension line</text>
  <text class="lbl2" x="150" y="97">dimension line</text>
</svg>
