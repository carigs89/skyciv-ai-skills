<svg viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <style>
    .cloud { stroke:#2b6cb0; stroke-width:2.5; fill:none; }
    .box   { stroke:#a0aec0; stroke-width:1; stroke-dasharray:4,3; fill:none; }
    .pt    { fill:#dd6b20; }
    .lbl   { fill:#1a202c; font-size:12px; }
    .title { fill:#1a202c; font-size:14px; font-weight:bold; }
  </style>
  <rect x="0" y="0" width="520" height="260" fill="#ffffff"/>

  <text class="title" x="30" y="24">Rectangular</text>
  <rect class="box" x="40" y="60" width="160" height="120"/>
  <path class="cloud" d="
    M40,60
    q20,-14 40,0 q20,14 40,0 q20,-14 40,0 q20,14 40,0
    q14,20 0,40 q-14,20 0,40
    q-20,14 -40,0 q-20,-14 -40,0 q-20,14 -40,0 q-20,-14 -40,0
    q-14,-20 0,-40 q14,-20 0,-40
  "/>
  <circle class="pt" cx="40" cy="60" r="4"/>
  <text class="lbl" x="8" y="52">minX,minY</text>
  <circle class="pt" cx="200" cy="180" r="4"/>
  <text class="lbl" x="150" y="200">maxX,maxY</text>
  <text class="lbl" x="30" y="212">arcRadius: scallop size</text>
  <text class="lbl" x="30" y="226">segments: scallop count</text>

  <text class="title" x="330" y="24">Circular</text>
  <circle class="box" cx="400" cy="130" r="80"/>
  <path class="cloud" d="
    M400,50
    q14,20 0,26 q-14,-6 0,26 q14,20 0,26 q-14,-6 0,26 q14,20 0,26 q-14,-6 0,26
    q-20,14 -26,0 q6,-14 -26,0 q-20,14 -26,0 q6,-14 -26,0 q-20,14 -26,0 q6,-14 -26,0
    q-14,-20 0,-26 q14,6 0,-26 q-14,-20 0,-26 q14,6 0,-26 q-14,-20 0,-26 q14,6 0,-26
    q20,-14 26,0 q-6,14 26,0 q20,-14 26,0 q-6,14 26,0 q20,-14 26,0 q-6,14 26,0
  "/>
  <circle class="pt" cx="400" cy="130" r="4"/>
  <text class="lbl" x="405" y="128">center</text>
  <line x1="400" y1="130" x2="400" y2="50" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="lbl" x="360" y="45">radius</text>

  <text class="lbl" x="20" y="250">Pass arcs: [] when creating programmatically — the renderer computes the scallop geometry.</text>
</svg>
